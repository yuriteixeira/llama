version = 1

[*]
n-gpu-layers = all
; Current device order on this host:
;   CUDA0 = RTX 3070 8GB
;   CUDA1 = RTX 5060 Ti 16GB
; Large models are pinned to CUDA1; small models are pinned to CUDA0.
ctx-size = 65536
; turbo3/turbo4 asymmetric KV cache for better quality/performance balance
; turbo3 on keys (more important), turbo4 on values (less important)
cache-type-k = turbo3
cache-type-v = turbo4
cache-reuse = 256
; save VRAM on big-vocab models: only reserve logits buffer for last token (chat/completion workloads don't need per-token logits)
logits-all = false
load-on-startup = false
reasoning = off
chat-template-kwargs = {"enable_thinking":true}

[1-smart-qwen3-8-27b]
model = /home/yuriteixeira/Workspaces/local/services/llama/models/unsloth/Qwen3.8-27B-UD-Q3_K_XL.gguf
device = CUDA1
; Dense Q3_K_XL model: 32K context preserves VRAM headroom on the 16GB GPU.
; Text-only setup; do not load the separate vision projector.
n-gpu-layers = 99
cache-reuse = 0
ctx-size = 32768
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
