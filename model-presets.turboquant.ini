version = 1

[*]
n-gpu-layers = all
; Current device order on this host:
;   CUDA0 = RTX 3070 8GB
;   CUDA1 = RTX 5060 Ti 16GB
; Large models are pinned to CUDA1; small models are pinned to CUDA0.
ctx-size = 65536
; TurboQuant+ recommendation: keep K near-lossless and compress V.
; Start with q8_0/turbo3 as the default balance; use f16/turbo4 for maximum safety
; or q8_0/turbo2 after model-specific validation when long-context VRAM is tight.
; But I'm being more eager here
; turbo3/turbo4 asymmetric KV cache for better quality/performance balance
; turbo3 on keys (more important), turbo4 on values (less important)
cache-type-k = turbo3
cache-type-v = turbo4
cache-reuse = 256
; llama-cpp-turboquant follows upstream router preset compatibility; avoid buun-only preset options.
load-on-startup = false
reasoning = off
chat-template-kwargs = {"enable_thinking":true}

[1-smart-qwen3-6-35b-a3b]
model = /home/yuriteixeira/Workspaces/local/services/llama/models/unsloth/Qwen3.6-35B-A3B-UD-IQ4_NL.gguf
device = CUDA1
; Aggressive MoE offload to free VRAM for 128K context.
; Benchmark: start at 16, test up to 24.
n-cpu-moe = 16
ctx-size = 131072
temp = 0.6
top-p = 0.95
top-k = 80

[2-glm-flash]
model = /home/yuriteixeira/Workspaces/local/services/llama/models/unsloth/GLM-4.7-Flash-Q4_K_M.gguf
device = CUDA1
; GLM has larger hidden dim (5120), each MoE layer costs more VRAM.
; Benchmark: start at 20, test up to 28.
