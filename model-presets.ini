version = 1

[*]
; explicit per-model context/cache overrides below keep large models inside RTX 3070 8GB VRAM
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse = 256
; save VRAM on big-vocab models: only reserve logits buffer for last token (chat/completion workloads don't need per-token logits)
logits-all = false
load-on-startup = false
reasoning = off
chat-template-kwargs = {"enable_thinking":true}

