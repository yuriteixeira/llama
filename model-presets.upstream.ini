; GPUs on this server:
;   CUDA0 = RTX 3070 8GB (slowest PCIe slot)
;   CUDA1 = RTX 5060 Ti 16GB (fastest PCIe slot)
;
; Defaults to CUDA1. Put large models are pinned to CUDA1.

version = 1

[*]
device = CUDA1
n-gpu-layers = all
ctx-size = 32768
cache-type-k = q4_0
cache-type-v = q4_0
load-on-startup = false
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
flash-attn = on
parallel = 1
jinja = true
verbosity = 4
reasoning-effort = medium

[local-32k]
model = /home/yuriteixeira/Workspaces/local/services/llama/models/unsloth/Qwen3.8-27B-UD-IQ4_XS.gguf

