; GPUs on this server:
;   CUDA0 = RTX 3070 8GB (slowest PCIe slot)
;   CUDA1 = RTX 5060 Ti 16GB (fastest PCIe slot)
;
; Defaults to CUDA1. Larger contexts can use both GPUs.
;
; Sampling sources, checked October 18, 2026:
; https://huggingface.co/Qwen/Qwen3.8-27B#best-practices
; https://huggingface.co/Qwen/Qwen3.6-35B-A3B#best-practices
; https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-GGUF

version = 1

[*]
device = CUDA1
ctx-size = 32768
load-on-startup = false
n-gpu-layers = all
cache-type-k = q4_0
cache-type-v = q4_0
flash-attn = on
jinja = true
verbosity = 4

